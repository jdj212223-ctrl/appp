# The RealismPhoneOS App Store on Cloudflare Workers: D1 keeps the app list and the .appp files.
name = "appp-store"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
STORE_NAME = "RealismPhoneOS App Store"

[[d1_databases]]
binding = "DB"
database_name = "appp"
database_id = "7773f2e0-cf21-4dd7-911b-852c42a7c3d2"

# Files (.appp packages, icons) are kept in D1 too: phone apps are small, so no R2 bucket is needed.

# Secret (not in this file): STAMP_KEY, the Ed25519 private key that signs "scanned clean" stamps.
#   node scripts/genkey.mjs            prints one
#   npx wrangler secret put STAMP_KEY  stores it on Cloudflare (for local dev it goes in .dev.vars)
